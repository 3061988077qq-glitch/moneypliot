# MoneyPilot mainland-site Nginx template
#
# Example public URLs:
#   https://example.com/moneypilot/
#   https://example.com/moneypilot/app/index.html
#
# Upload the contents of mainland-site to:
#   /www/wwwroot/example.com/moneypilot/

location /moneypilot/ {
  try_files $uri $uri/ /moneypilot/index.html;
}

location /moneypilot/app/ {
  try_files $uri $uri/ /moneypilot/app/index.html;
}

location = /moneypilot/app/service-worker.js {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}

location ~* ^/moneypilot/app/(assets|src)/ {
  expires 7d;
  add_header Cache-Control "public";
  try_files $uri =404;
}
